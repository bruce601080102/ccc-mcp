name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without v (for example 0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  require-main:
    name: require main branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - name: Release only from main
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "Choose main when starting the release workflow" >&2
            exit 1
          }
      - name: Validate the chosen version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/release_version.py "$RELEASE_VERSION" --validate-only
      - name: Reject a version that already has a tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi

  verify:
    needs: require-main
    uses: ./.github/workflows/checks.yaml
    with:
      full_checks: true
      release_version: ${{ inputs.version }}

  github-release:
    name: attach build to GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Tag the exact versioned source used for this release
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$REQUESTED_VERSION"
          python scripts/release_artifacts.py --expected "$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            echo "Tag v${RELEASE_VERSION} already exists" >&2
            exit 1
          fi
          python scripts/release_version.py "$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/ccc_mcp/__init__.py; then
            git add src/ccc_mcp/__init__.py
            git commit -m "Release v${RELEASE_VERSION}"
          fi
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push origin "refs/tags/v${RELEASE_VERSION}"
      - name: Create release with the sdist and wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "v${RELEASE_VERSION}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --title "v${RELEASE_VERSION}" --generate-notes

  publish:
    name: publish
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ccc-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2
