name: Package checks

on:
  workflow_call:
    inputs:
      full_checks:
        description: Run the complete platform matrix and built-wheel installation checks
        required: false
        type: boolean
        default: false
      release_version:
        description: Version chosen in the manual Release form; empty for ordinary CI
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: Version read from the validated build artifacts
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "ruff>=0.13,<1"
      - run: ruff check src tests scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check bundled UI JavaScript syntax
        run: |
          node --check src/ccc_mcp/interfaces/webui_static/app.js
          node --check src/ccc_mcp/interfaces/webui_static/i18n.js

  quick-test:
    name: quick test (${{ matrix.os }})
    if: inputs.full_checks == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Configure Git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: python -m pip install -e ".[dev]"
      - name: Fast package, workflow, security and platform checks
        run: >-
          python -m pytest -q --maxfail=1
          tests/test_release_version.py
          tests/test_release_artifacts.py
          tests/test_release_workflows.py
          tests/test_claude_usage.py::test_statusline_capture_preserves_existing_command_and_only_saves_limits
          tests/test_web_ui.py::test_account_usage_reads_documented_app_server_metrics
          tests/test_web_ui.py::test_task_conversation_endpoints_are_persistent_and_token_gated
          tests/test_protocol_schema.py
          tests/test_security.py::test_secret_filters_and_context_rejection
          tests/test_workflow_engine.py::test_full_workflow_runs_every_step_in_order_and_completes
          tests/test_tasks.py::test_review_revision_loop

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: inputs.full_checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux covers every supported Python version. macOS and Windows run the
          # same suite once to catch OS-specific path, process and locking behavior.
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Configure Git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Install release version validator
        if: inputs.release_version != ''
        run: python -m pip install packaging
      - name: Use the manually chosen version for this checkout
        if: inputs.release_version != ''
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release_version.py "$RELEASE_VERSION"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    name: build sdist + wheel
    if: inputs.full_checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.artifacts.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine packaging
      - name: Use the manually chosen version for this checkout
        if: inputs.release_version != ''
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release_version.py "$RELEASE_VERSION"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Validate artifacts and read their version
        id: artifacts
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python scripts/release_artifacts.py --expected "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke-install:
    name: install wheel (${{ matrix.os }})
    if: inputs.full_checks
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the exact built wheel
        run: python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0])])"
      - name: Smoke-test the installed CLI
        run: |
          python -m ccc_mcp --help
          python -c "import ccc_mcp, importlib.metadata as m; assert ccc_mcp.__version__ == m.version('ccc-mcp'); print(ccc_mcp.__version__)"
      - name: Verify the Windows runtime dependency
        if: runner.os == 'Windows'
        run: python -c "import win32job"

