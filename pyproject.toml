[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "ccc-mcp"
dynamic = ["version", "readme"]
description = "Persistent context and governed agent orchestration over MCP"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "chatgpt", "codex", "claude-code", "ai-agents", "workflow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]
dependencies = [
  "mcp>=2.3,<3", "pydantic>=2.10,<3", "typer>=0.16,<1",
  "portalocker>=3,<4", "psutil>=7,<8", "PyJWT[crypto]>=2.10,<3",
  # Already installed transitively by mcp (its HTTP transport); listed explicitly
  # because interfaces/web.py (the `ccc-mcp ui` local console) now depends on them
  # directly too.
  "starlette>=1,<2", "uvicorn>=0.30,<1",
  # adapters/agents/base.py imports win32api/win32con/win32job to kill agent process trees
  "pywin32>=311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/bruce601080102/ccc-mcp"
Repository = "https://github.com/bruce601080102/ccc-mcp"
Issues = "https://github.com/bruce601080102/ccc-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-xdist>=3.6,<4", "httpx>=0.28,<1", "ruff>=0.13,<1", "packaging>=24", "PyYAML>=6"]

[project.scripts]
ccc-mcp = "ccc_mcp.interfaces.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m \"not real_agents\""
markers = [
  "integration: real worker processes, real host-test subprocesses or a real browser; the fast core suite is `pytest -m \"not integration and not real_agents\"`, the full acceptance run is plain `pytest`",
  "real_agents: exercises actually-installed, logged-in Codex/Claude CLIs end to end; excluded by default (see docs/en/1-install-and-sign-in.md), run explicitly with `-m real_agents`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "PLW1510"]

[tool.hatch.version]
path = "src/ccc_mcp/__init__.py"

# PyPI cannot resolve repository-relative paths, so README.md (which stays relative for GitHub)
# is rewritten to absolute repository URLs only in the published package description.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''src="(docs/assets/[^"]+)"'''
replacement = 'src="https://raw.githubusercontent.com/bruce601080102/ccc-mcp/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(!\[[^\]]*\]\()(docs/assets/[^)\s]+)\)'''
replacement = '\1https://raw.githubusercontent.com/bruce601080102/ccc-mcp/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '''(\]\()(?!https?://|#|mailto:)([^)\s]+)\)'''
replacement = '\1https://github.com/bruce601080102/ccc-mcp/blob/main/\2)'

[tool.hatch.build.targets.wheel]
packages = ["src/ccc_mcp"]
